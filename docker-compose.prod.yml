services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_prod_pass
      POSTGRES_DB: codementor
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - codementor_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres_secure_prod_pass@postgres:5432/codementor
      - JWT_SECRET=codementor_production_secret_key_2026
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-deepseek-coder}
      - LLM_API_KEY=${LLM_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - codementor_net

  sandbox:
    build:
      context: ./backend/sandbox
      dockerfile: Dockerfile
    restart: always
    environment:
      - SANDBOX_TIMEOUT_SECONDS=10
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  student-portal:
    build:
      context: ./frontend/student-portal
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - codementor_net

  faculty-dashboard:
    build:
      context: ./frontend/faculty-dashboard
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4174:4174"
    depends_on:
      backend:
        condition: service_started
    networks:
      - codementor_net

networks:
  codementor_net:
    driver: bridge

volumes:
  postgres_prod_data:
